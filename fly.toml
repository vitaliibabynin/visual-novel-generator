app = "visual-novel-generator"
primary_region = "iad"

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_gb = 1

[mounts]
  source = "story_data"
  destination = "/app/stories"

[mounts]
  source = "image_data"
  destination = "/app/static/images"
